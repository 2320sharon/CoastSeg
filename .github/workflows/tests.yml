name: Tests

on:
  push:
    # push to any dev/<name> branch to run the full matrix without opening a PR.
    branches: [main, develop, "dev/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede in-flight runs on PRs and ci/** branches; never abandon one on main
  # or develop.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/develop' }}

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          # 3.11.4 is the newest gdal whose libgdal still has a py3.10 pyogrio build.
          # Without this ceiling the solver never converges on 3.10; a ceiling rather
          # than a pin so it falls back on its own if that build ever goes away.
          # 3.11/3.12 need nothing.
          - python-version: "3.10"
            extra-specs: "gdal<=3.11.4"
    defaults:
      run:
        # Login shell so the micromamba hook is sourced; -e so a failing line fails the step.
        shell: bash -el {0}
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - uses: actions/checkout@v4

      # Rotating the key weekly keeps CI noticing upstream breakage; a hash-only key
      # would freeze the resolved environment forever.
      - name: Compute weekly cache bucket
        id: bucket
        run: echo "week=$(date -u +'%Y-%V')" >> "$GITHUB_OUTPUT"

      - name: Provision the conda environment
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: ci/environment.yml
          environment-name: coastseg-ci
          create-args: >-
            python=${{ matrix.python-version }}
            ${{ matrix.extra-specs }}
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          cache-environment: true
          # matrix.extra-specs is part of the key: without it, editing the pin above
          # would restore an environment solved under the old one.
          cache-environment-key: >-
            micromamba-${{ runner.os }}-${{ runner.arch }}-py${{ matrix.python-version }}-${{ hashFiles('ci/environment.yml') }}-${{ matrix.extra-specs }}-${{ steps.bucket.outputs.week }}
          cache-downloads: true
          init-shell: bash
          post-cleanup: none

      - name: Environment report
        run: |
          micromamba info
          micromamba list

      - name: Install coastseg
        run: python -m pip install -e .

      # Two seconds and a legible message if pip replaced a conda binary, instead of a
      # confusing failure deep in pytest. geopandas covers the pyogrio/libgdal pairing.
      - name: Verify the conda stack survived the pip install
        run: |
          python -c "
          import sys, numpy, geopandas
          from osgeo import gdal
          import coastseg
          print('python   ', sys.version.split()[0])
          print('gdal     ', gdal.__version__)
          print('numpy    ', numpy.__version__)
          print('geopandas', geopandas.__version__)
          print('coastseg ', coastseg.__version__)
          "

      - name: Run the test suite
        run: python -m pytest -q tests
