on:
  push:
    branches: [main,develop]
  pull_request:
    branches: [main,develop]

name: Test CoastSeg Pip Package From PyPI 
jobs:
  Test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Use a login bash shell so setup-miniconda's conda activation is available
        # in every run step. The -e flag makes the step fail on command errors.
        shell: bash -el {0}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniconda-version: "latest"
          python-version: ${{ matrix.python-version }}
          activate-environment: test
          channels: conda-forge
          channel-priority: strict

      - name: Show conda environment
        run: |
          conda info
          conda list
          which python
          python --version

      - name: Install conda dependencies
        run: |
          conda install -c conda-forge gdal pytest -y

      - name: Install coastseg from pip
        run: |
          python -m pip install --upgrade pip
          python -m pip install coastseg
          python -m pip show coastseg
      - name: Test with pytest
        run: |
          python -m pytest -q tests
