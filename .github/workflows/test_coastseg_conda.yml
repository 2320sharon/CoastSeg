on:
  push:
    branches: [fix_conda_action]
  pull_request:
    branches: [fix_conda_action]

name: Test CoastSeg Conda Package

jobs:
  Test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -el {0}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Setup micromamba environment
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: test
          init-shell: bash
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict
          create-args: >-
            python=${{ matrix.python-version }}
            coastseg=2.0.2
            pytest

      - name: Show environment
        run: |
          set -euo pipefail

          micromamba info
          micromamba list
          which python
          python --version
          echo "CONDA_DEFAULT_ENV=$CONDA_DEFAULT_ENV"
          echo "CONDA_PREFIX=$CONDA_PREFIX"

      - name: Verify CoastSeg import
        run: |
          set -euo pipefail

          python - <<'PY'
          import sys
          import coastseg

          print("Python:", sys.version)
          print("CoastSeg imported from:", coastseg.__file__)
          PY

      - name: Test with pytest
        run: |
          set -euo pipefail

          cd "$RUNNER_TEMP"
          python -m pytest -q --import-mode=importlib "$GITHUB_WORKSPACE/tests"