name: Test CoastSeg Conda Package

on:
  push:
    branches: [fix_conda_action]
  pull_request:
    branches: [fix_conda_action]
  workflow_dispatch:

jobs:
  Test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    defaults:
      run:
        shell: bash -leo pipefail {0}

    steps:
      - uses: actions/checkout@v5

      - name: Setup micromamba only
        uses: mamba-org/setup-micromamba@v3
        with:
          init-shell: none
          post-cleanup: all
          condarc: |
            channels:
              - conda-forge
            channel_priority: strict

      - name: Check micromamba can run
        run: |
          micromamba --version
          micromamba info

      - name: Create test environment
        run: |
          micromamba create -y -n test \
            -c conda-forge \
            --strict-channel-priority \
            "python=${{ matrix.python-version }}" \
            coastseg=2.0.3 \
            pytest \
            pip

      - name: Show environment
        run: |
          micromamba list -n test
          micromamba run -n test python --version
          micromamba run -n test python -m pip check

      - name: Verify CoastSeg import
        run: |
          micromamba run -n test python - <<'PY'
          import importlib.metadata as md
          import os
          import pathlib
          import sys
          import coastseg

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          imported_from = pathlib.Path(coastseg.__file__).resolve()

          print("Python:", sys.version)
          print("CoastSeg version:", md.version("coastseg"))
          print("CoastSeg imported from:", imported_from)

          try:
              imported_from.relative_to(workspace)
          except ValueError:
              pass
          else:
              raise SystemExit("ERROR: imported CoastSeg from checkout, not conda package")
          PY

      - name: Test with pytest
        run: |
          cd "$RUNNER_TEMP"
          micromamba run -n test python -m pytest -q \
            --import-mode=importlib \
            "$GITHUB_WORKSPACE/tests"