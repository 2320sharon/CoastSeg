on:
  push:
    branches: [fix_conda_action]
  pull_request:
    branches: [fix_conda_action]

name: Test CoastSeg Conda Package

jobs:
  Test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -el {0}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Setup Conda
        uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: "latest"
          python-version: ${{ matrix.python-version }}
          activate-environment: test
          channels: conda-forge
          channel-priority: strict
          use-mamba: true

      - name: Show conda environment
        run: |
          set -euo pipefail

          mamba info
          mamba list
          which python
          python --version
          echo "CONDA_DEFAULT_ENV=$CONDA_DEFAULT_ENV"
          echo "CONDA_PREFIX=$CONDA_PREFIX"

      - name: Preflight ensure CoastSeg is available on conda-forge for this Python
        run: |
          set -euo pipefail

          echo "Checking solver availability for: python=${{ matrix.python-version }} + coastseg (conda-forge only)"

          # Dry-run solve. This exits non-zero if no compatible coastseg build exists.
          mamba create -n _solvecheck -y --dry-run --override-channels -c conda-forge \
            "python=${{ matrix.python-version }}" \
            coastseg=2.0.2

          echo "OK: conda-forge can solve coastseg for python=${{ matrix.python-version }}"

      - name: Install CoastSeg conda package (conda-forge only)
        run: |
          set -euo pipefail

          mamba install -y --override-channels -c conda-forge \
            "python=${{ matrix.python-version }}" \
            coastseg=2.0.2 \
            pytest

          mamba list coastseg
          mamba list pytest

      - name: Verify CoastSeg import
        run: |
          set -euo pipefail

          python - <<'PY'
          import sys
          import coastseg

          print("Python:", sys.version)
          print("CoastSeg imported from:", coastseg.__file__)
          PY

      - name: Test with pytest
        run: |
          set -euo pipefail

          # Change to the runner's temporary directory to ensure tests are run in a clean environment.
          cd "$RUNNER_TEMP"

          # $GITHUB_WORKSPACE is the checked out CoastSeg repository.
          python -m pytest -q --import-mode=importlib "$GITHUB_WORKSPACE/tests"