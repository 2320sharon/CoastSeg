# ✍️ Description:
# Proves the conda-forge side of the environment can be SOLVED on every Python
# version CoastSeg claims to support.
#
# The committed pixi.lock resolves Python 3.12 on all four platforms, because
# pyproject.toml intentionally pins no Python version for pixi. So
# test_coastseg_with_pixi.yml -- which runs `locked: true` against that lock --
# never exercises 3.10 or 3.11. This workflow forces each version in a
# throwaway checkout and re-solves from scratch.
#
# pixi solves every platform in [tool.pixi.workspace] platforms in one
# operation, so one ubuntu runner per Python version covers win-64, linux-64,
# osx-64 and osx-arm64. (It also covers osx-64, which a macos-latest runner
# could not -- that image is arm64.)
#
# 🚨 GITHUB SECRETS REQUIRED: None
name: "Pre-release: pixi solve (Python 3.10-3.12)"

on:
  workflow_dispatch:
  push:
    # Same tag patterns as Publish_package_to_pypi.yml. ex. v2.0.4 or v2.0.4dev1
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+a[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+b[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+dev[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  solve:
    name: Solve on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the tree is releasable
        # A machine-local path dependency shows up here as an opaque pixi
        # resolution error, so fail early with a message that names the line.
        run: |
          python .github/scripts/check_release_ready.py \
            --python-versions 3.10 3.11 3.12

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.66.0
          manifest-path: pyproject.toml
          # Solve only. Installing would download multiple GB per job and
          # answers a question test_coastseg_with_pixi.yml already covers.
          run-install: false
          cache: false

      - name: Pin Python ${{ matrix.python-version }} and re-solve
        # The runner checkout is disposable, so pin in place rather than
        # committing per-version pixi environments (which would triple the size
        # of pixi.lock and have to be kept in sync on every dependency change).
        # A non-zero exit from `pixi lock` IS the "cannot solve" signal.
        run: |
          python .github/scripts/pin_pixi_python.py "${{ matrix.python-version }}"
          rm -f pixi.lock
          pixi lock

      - name: Summarize the resolved environment
        # Surfaces what each Python version actually pulled in, so a solve that
        # succeeds but resolves something undesirable is still visible -- most
        # usefully whether onnxruntime kept its `_cpu` build string.
        if: always()
        run: |
          python .github/scripts/summarize_pixi_lock.py \
            --label "Python ${{ matrix.python-version }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the resolved lockfile
        # Download these to diff what each Python version resolved to.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pixi-lock-py${{ matrix.python-version }}
          path: pixi.lock
          if-no-files-found: warn

  locked-check:
    name: Committed pixi.lock is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: v0.66.0
          manifest-path: pyproject.toml
          run-install: false
          cache: false

      - name: Verify pixi.lock matches pyproject.toml
        # Fails if pyproject.toml was edited without re-running `pixi lock`.
        # test_coastseg_with_pixi.yml catches this too, but only on push to
        # main/develop -- this makes it available on demand before a release.
        run: pixi lock --check
