on:
  push:
    branches: [main, develop, isolate_segmentation_code]
  pull_request:
    branches: [main, develop, isolate_segmentation_code]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

name: Test CoastSeg Pixi Installation (pixi run test)

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0.9.3
        with:
          # Use a recent Pixi version
          pixi-version: v0.59.0

          # Make sure Pixi uses your pyproject.toml as manifest
          manifest-path: pyproject.toml

          # Pre-install and cache the test environment
          environments: test

          cache: true
          cache-write: ${{ github.event_name == 'push' && github.ref_name == 'develop' }}

          # Resolve per matrix entry to allow Python-version matrix testing.
          locked: false

      - name: Set matrix Python in Pixi env
        run: pixi add --environment test "python==${{ matrix.python-version }}.*"

      - name: "Run tests (Pixi env: test)"
        run: pixi run -e test run_tests